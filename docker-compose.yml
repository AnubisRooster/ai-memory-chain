version: "3.9"

services:
  polygon-edge:
    image: 0xpolygon/polygon-edge:1.3.0
    container_name: polygon-edge
    restart: unless-stopped
    ports:
      - "8545:8545"
      - "10000:10000"
    volumes:
      - ./data/polygon-edge:/data
      - ./scripts/edge-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 10

  ipfs:
    image: ipfs/kubo:v0.27.0
    container_name: ipfs-node
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ./data/ipfs:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    healthcheck:
      test: ["CMD-SHELL", "ipfs dag stat /ipfs/QmUNLLsPACCz1vLxQVkXqqLX5R1X345qqfHbsf67hvA3Nn || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  polygon-edge-data:
  ipfs-data:
